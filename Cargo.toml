[package]
name = "avro-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Apache Avro building blocks shared by Tessera and Mapster: values, binary encoding, codecs, a streaming container writer, and text forms of logical types"
publish = false

[dependencies]
base64 = "0.23.1"
bzip2 = "0.6.1"
crc32fast = "1.5.4"
# deflate through flate2 (its default backend is miniz_oxide, pure Rust): Mapster wrote with it,
# and miniz_oxide's one-shot compress_to_vec differs from flate2's streaming at level 1
flate2 = "1.1.11"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
ruzstd = "0.9.1"
snap = "1.1.2"

[dev-dependencies]
apache-avro = { version = "0.22.0", features = ["snappy", "zstandard", "bzip", "xz"] }
